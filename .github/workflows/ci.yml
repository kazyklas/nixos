name: CI

# Proof, before a merge, that the flake still evaluates and every host still
# builds. One job per host in flake.nix's `nixosConfigurations` list — add a
# machine there (per the flake's own comment) and add its name here too.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [ laptop, beast ]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build nixosConfigurations.${{ matrix.host }}
        run: |
          nix build --accept-flake-config --no-link --print-build-logs \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
